<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cazon.uk</title>
<meta name="theme-color" content="#000">
<style>
  :root {
    --bg: #000;
    --text: #e6e6e6;
    --muted: #8d9096;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-hover: rgba(255, 255, 255, 0.14);
    --border: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    padding: 12vh 20px 48px;
    overflow-x: hidden;
  }

  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

  h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: .02em; animation: in .6s ease both; }
  .sub { color: var(--muted); font-size: .85rem; margin: 6px 0 28px; animation: in .6s .08s ease both; }

  ul { list-style: none; border-top: 1px solid var(--border); }
  li { border-bottom: 1px solid var(--border); animation: in .6s ease both; animation-delay: calc(.15s + var(--i) * .06s); }
  a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 15px 14px;
    color: inherit;
    text-decoration: none;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background .2s, padding-left .25s;
  }
  a:hover, a:focus-visible { background: var(--glass-hover); padding-left: 24px; outline: none; }
  .name { font-size: 1rem; }
  .url { color: var(--muted); font-size: .82rem; transition: color .2s; }
  a:hover .url, a:focus-visible .url { color: var(--text); }


  .mascot { position: fixed; right: 0; bottom: 0; height: min(78vh, 620px); width: auto; z-index: 0; pointer-events: none; user-select: none; animation: in 1s .5s ease both; }
  @media (max-width: 700px) { .mascot { height: 32vh; opacity: .5; } body { padding-bottom: 30vh; } }

  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <img class="mascot" src="kazusa.png" alt="" aria-hidden="true">
  <main>
    <h1>cazon.uk</h1>
    <p class="sub">services</p>
    <ul>
      <li style="--i:0"><a href="https://matrix.cazon.uk"><span class="name">matrix</span><span class="url">matrix.cazon.uk</span></a></li>
      <li style="--i:1"><a href="https://music.cazon.uk"><span class="name">music</span><span class="url">music.cazon.uk</span></a></li>
      <li style="--i:1"><a href="https://music.cazon.uk"><span class="name">mail</span><span class="url">mail.cazon.uk</span></a></li>
      <li style="--i:2"><a href="https://photos.cazon.uk"><span class="name">photos</span><span class="url">photos.cazon.uk</span></a></li>
      <li style="--i:3"><a href="https://vault.cazon.uk"><span class="name">vault</span><span class="url">vault.cazon.uk</span></a></li>
      <li style="--i:4"><a href="https://cloud.cazon.uk"><span class="name">cloud</span><span class="url">cloud.cazon.uk</span></a></li>
      <li style="--i:5"><a href="https://play.cazon.uk"><span class="name">play</span><span class="url">play.cazon.uk</span></a></li>
      <li style="--i:6"><a href="https://status.cazon.uk"><span class="name">status</span><span class="url">status.cazon.uk</span></a></li>
    </ul>
  </main>
</body>
</html>
