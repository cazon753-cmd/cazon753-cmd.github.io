<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cazon.uk</title>
<meta name="theme-color" content="#000">
<style>
  :root {
    --bg: #000;
    --text: #e6e6e6;
    --muted: #8d9096;
    --border: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    padding: 12vh 20px 48px;
    overflow-x: hidden;
  }

  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

  h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: .02em; animation: in .6s ease both; }
  .sub { color: var(--muted); font-size: .85rem; margin: 6px 0 0; animation: in .6s .08s ease both; }
  .notice { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; line-height: 1.6; animation: in .6s .15s ease both; }

  .mascot { position: fixed; right: 0; bottom: 0; height: min(78vh, 620px); width: auto; z-index: 0; pointer-events: none; user-select: none; animation: in 1s .5s ease both; }
  @media (max-width: 700px) { .mascot { height: 32vh; opacity: .5; } body { padding-bottom: 30vh; } }

  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <img class="mascot" src="kazusa.png" alt="" aria-hidden="true">
  <main>
    <h1>cazon.uk</h1>
    <p class="sub">offline</p>
    <p class="notice">security vulnerability, all services must be updated. cazon.uk</p>
  </main>
</body>
</html>
